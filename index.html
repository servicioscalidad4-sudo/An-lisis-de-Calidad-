<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Control Renacer v25.2 | Auditoría y SLA</title>
    <style>
        :root {
            --jr-dark: #1a0e2a; 
            --jr-gold: #c8a951;
            --jr-gold-light: #e2d5b0;
            --jr-green: #008f4c;
            --jr-red: #d93025;
            --jr-bg: #f4f7f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--jr-bg); color: #333; padding-bottom: 50px; }

        .header {
            background-color: var(--jr-dark);
            padding: 20px 40px;
            display: flex;
            align-items: center;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            border-bottom: 4px solid var(--jr-gold);
        }
        .header img { width: 60px; height: 60px; margin-right: 20px; background: white; border-radius: 50%; padding: 5px; object-fit: contain; }
        .header-text h1 { font-size: 24px; font-weight: 700; color: white; margin-bottom: 4px; }
        .header-text p { font-size: 13px; color: var(--jr-gold-light); opacity: 0.9; }

        .btn-dashboard {
            margin-left: auto;
            background-color: var(--jr-gold);
            color: var(--jr-dark);
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 800;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
            border: 2px solid var(--jr-gold);
        }

        .container { max-width: 1450px; margin: 30px auto; padding: 0 20px; }

        .upload-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .drop-card {
            background: white;
            border: 2px dashed #ddd;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .drop-card:hover { border-color: var(--jr-gold); background: #fffcf5; }
        .drop-card i { font-size: 35px; display: block; margin-bottom: 10px; font-style: normal; }
        .drop-ok { color: var(--jr-green); font-weight: 800; font-size: 13px; display: block; margin-top: 10px; }
        input[type="file"] { display: none; }

        .btn-main {
            width: 100%;
            background-color: #888;
            color: white;
            border: none;
            padding: 18px;
            font-size: 15px;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 10px;
            cursor: not-allowed;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }
        .btn-main.active { background-color: var(--jr-dark); color: var(--jr-gold); cursor: pointer; }

        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 25px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; border-left: 5px solid var(--jr-gold); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .stat-card label { font-size: 11px; color: #888; text-transform: uppercase; display: block; margin-bottom: 5px; }
        .stat-card span { font-size: 30px; font-weight: 800; color: var(--jr-dark); }

        .table-container { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        thead { background-color: var(--jr-dark); color: var(--jr-gold-light); }
        th { padding: 15px; text-align: left; }
        td { padding: 15px; border-bottom: 1px solid #eee; vertical-align: top; }
        
        /* ESTILO PARA LAS ALERTAS DE TIEMPO */
        .tag-sla {
            display: inline-block;
            background: #fff5f5;
            color: var(--jr-red);
            border: 1px solid var(--jr-red);
            padding: 2px 8px;
            border-radius: 5px;
            font-weight: 800;
            font-size: 10px;
            margin-top: 5px;
        }
        .nov-ul { list-style: none; color: #444; }
        .nov-ul li { margin-bottom: 4px; }
        .nov-ul li::before { content: "• "; color: var(--jr-red); font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    <img src="https://i.ibb.co/3ykS8mS/JR-Logo.png" alt="JR Logo">
    <div class="header-text">
        <h1>Sistema de Control Renacer</h1>
        <p>Auditoría de Operatividad y Cumplimiento de Tiempos (SLA)</p>
    </div>
    <a href="https://tu-app.streamlit.app" target="_blank" class="btn-dashboard">
        📊 VER GRÁFICAS DE HORARIOS →
    </a>
</div>

<div class="container">
    <div class="upload-grid">
        <div class="drop-card" onclick="document.getElementById('f1').click()">
            <i>📋</i>
            <h3>Base de Servicios</h3>
            <span id="ok1" class="drop-ok" style="display:none">✔ CARGADO</span>
            <input type="file" id="f1" accept=".csv, .txt">
        </div>
        <div class="drop-card" onclick="document.getElementById('f2').click()">
            <i>💰</i>
            <h3>Base de Gastos</h3>
            <span id="ok2" class="drop-ok" style="display:none">✔ CARGADO</span>
            <input type="file" id="f2" accept=".csv, .txt">
        </div>
        <div class="drop-card" onclick="document.getElementById('f3').click()">
            <i>📞</i>
            <h3>Llamadas</h3>
            <span id="ok3" class="drop-ok" style="display:none">✔ CARGADO</span>
            <input type="file" id="f3" accept=".csv, .txt">
        </div>
    </div>

    <button class="btn-main" id="btn-anal" disabled onclick="analizar()">INICIAR AUDITORÍA DE TIEMPOS →</button>

    <div id="results" style="display:none">
        <div class="stats-grid" id="main-stats"></div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Fallecido</th>
                        <th>Regional</th>
                        <th>Tiempos (SLA)</th>
                        <th>Novedades de Calidad</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let csvPrincipal = null, resultados = [];

    // Lector de archivos
    function readFile(file, okId, type) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = e => {
            document.getElementById(okId).style.display = 'block';
            if (type === 'p') {
                csvPrincipal = e.target.result;
                document.getElementById('btn-anal').disabled = false;
                document.getElementById('btn-anal').classList.add('active');
            }
        };
        reader.readAsText(file, 'latin1');
    }

    document.getElementById('f1').addEventListener('change', e => readFile(e.target.files[0], 'ok1', 'p'));

    function parseCSV(text) {
        const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
        const delim = lines[0].includes(';') ? ';' : ',';
        const headers = lines[0].split(delim).map(h => h.trim().replace(/^"|"$/g, ''));
        return lines.slice(1).map(line => {
            const values = line.split(delim);
            const obj = {};
            headers.forEach((h, i) => obj[h] = (values[i] || "").replace(/^"|"$/g, '').trim());
            return obj;
        });
    }

    // --- FUNCIÓN QUE UNE TODO: MATEMÁTICA DE TIEMPOS ---
    function analizar() {
        const rows = parseCSV(csvPrincipal);
        
        resultados = rows.map(r => {
            const novs = [];
            const alertsSLA = [];
            
            // 1. Obtener Datos de Tiempo
            const fSol = r["FECHASOLICITUD"] || r["FECHA SOLICITUD"];
            const hSol = r["HORASOLICITUD"] || r["HORA SOLICITUD"] || "00:00";
            const hRec = r["HORARECOGIDASERVICIO"] || r["HORA RECOGIDA SERVICIO"];
            const fEnt = r["FECHAENTRADA"] || r["FECHA ENTRADA"];
            const hEnt = r["HORAENTRADA"] || r["HORA ENTRADA"];

            // --- LÓGICA SLA 1: RECOGIDA (Meta < 3 horas) ---
            if (fSol && hRec && hRec !== "00:00") {
                const dtSol = new Date(`${fSol.split(' ')[0]}T${hSol}`);
                const dtRec = new Date(`${fSol.split(' ')[0]}T${hRec}`);
                
                if (!isNaN(dtSol) && !isNaN(dtRec)) {
                    const diffMin = (dtRec - dtSol) / 60000;
                    if (diffMin > 180) {
                        alertsSLA.push(`<div class="tag-sla">⚠️ RECOGIDA LENTA: ${Math.round(diffMin/60)}h ${Math.round(diffMin%60)}m</div>`);
                    }
                    if (diffMin < 0) novs.push("Error: Hora de recogida anterior a la solicitud");
                }
            }

            // --- LÓGICA SLA 2: PUESTA EN VELACIÓN (Meta < 4 horas desde recogida) ---
            if (hRec && fEnt && hEnt && hEnt !== "00:00") {
                const dtRec = new Date(`${fSol.split(' ')[0]}T${hRec}`);
                const dtEnt = new Date(`${fEnt.split(' ')[0]}T${hEnt}`);
                
                if (!isNaN(dtRec) && !isNaN(dtEnt)) {
                    const diffSLA2 = (dtEnt - dtRec) / 60000;
                    if (diffSLA2 > 240) {
                        alertsSLA.push(`<div class="tag-sla">⚠️ VELACIÓN TARDÍA: ${Math.round(diffSLA2/60)}h ${Math.round(diffSLA2%60)}m</div>`);
                    }
                }
            }

            // Otras validaciones de calidad
            if (!r["IDENTIFICACIONFALLECIDO"]) novs.push("Falta Cédula del Fallecido");
            if (!r["DESTINOFINAL"]) novs.push("Falta Destino Final");

            return { 
                id: r["NUMEROPRESTACION"] || r["PRESTACION"],
                nom: r["NOMBREFALLECIDO"],
                reg: r["REGIONAL"],
                sla: alertsSLA.join(''),
                novs: novs
            };
        });

        render();
        document.getElementById('results').style.display = 'block';
    }

    function render() {
        document.getElementById('tbody').innerHTML = resultados.map(r => `
            <tr>
                <td><strong>${r.id}</strong></td>
                <td>${r.nom}</td>
                <td>${r.reg}</td>
                <td>${r.sla || '<span style="color:green">✓ A Tiempo</span>'}</td>
                <td><ul class="nov-ul">${r.novs.map(n => `<li>${n}</li>`).join('')}</ul></td>
            </tr>
        `).join('');

        document.getElementById('main-stats').innerHTML = `
            <div class="stat-card"><label>Servicios</label><span>${resultados.length}</span></div>
            <div class="stat-card"><label>Retrasos SLA</label><span style="color:red">${resultados.filter(x=>x.sla!=='').length}</span></div>
            <div class="stat-card"><label>Novedades</label><span>${resultados.filter(x=>x.novs.length>0).length}</span></div>
            <div class="stat-card"><label>Eficiencia</label><span>${Math.round((resultados.filter(x=>x.sla==='').length / resultados.length)*100)}%</span></div>
        `;
    }
</script>
</body>
</html>
