<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Control Renacer | Dashboard Ejecutivo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a0e2a; /* El morado oscuro de tu logo */
            --gold: #c8a951;    /* El dorado corporativo */
            --bg: #f8f9fa;
        }
        body { font-family: 'Inter', sans-serif; margin: 0; background: var(--bg); color: var(--primary); display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card { background: white; padding: 3rem; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); text-align: center; max-width: 500px; border-top: 5px solid var(--gold); }
        h1 { font-weight: 600; margin-bottom: 0.5rem; }
        p { color: #666; margin-bottom: 2rem; line-height: 1.6; }
        .btn { 
            background: var(--primary); color: white; padding: 15px 35px; border-radius: 12px; 
            text-decoration: none; font-weight: 600; display: inline-block; transition: all 0.3s;
            border: 1px solid var(--primary);
        }
        .btn:hover { background: var(--gold); border-color: var(--gold); transform: translateY(-3px); }
        .footer { margin-top: 2rem; font-size: 0.8rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="card">
        <div style="font-size: 50px; margin-bottom: 20px;">📊</div>
        <h1>Auditoría Integral</h1>
        <p>Bienvenido al Sistema de Control de Calidad Renacer. Panel optimizado para la toma de decisiones gerenciales y análisis de operatividad funeraria.</p>
        <!-- REEMPLAZA LA URL DE ABAJO CON LA QUE TE DE STREAMLIT DESPUÉS -->
        <a href="https://tu-app-analisis.streamlit.app" class="btn">INGRESAR AL DASHBOARD</a>
        <div class="footer">Jardines del Renacer © 2024</div>
    </div>
</body>
</html>
